services:
  server:
    build: ./server
    environment:
      - PORT=5000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - CLIENT_ORIGIN=http://localhost:8080
    ports:
      - "5001:5000"   # host 5001 → container 5000 (host 5000 is AirPlay)
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
